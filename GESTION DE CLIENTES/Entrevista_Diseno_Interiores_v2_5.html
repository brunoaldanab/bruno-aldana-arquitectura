<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Entrevista — Diseño de Interiores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F6F8; --paper:#FFFFFF; --ink:#0B0B0E; --ink-soft:#6B6B74; --line:#E7E7EC;
    --clay:#5B4CFF; --clay-soft:#EDEBFF; --sage:#00B37E; --blue:#5B4CFF; --gold:#FF7A45; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .blueprint-bg{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.6;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: radial-gradient(circle at 15% 0%, black 0%, transparent 60%);
  }
  .app{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:36px 24px 120px;}
  header.top{display:flex; justify-content:space-between; align-items:center; border-bottom:none; padding-bottom:22px; margin-bottom:8px; gap:16px; flex-wrap:wrap;}
  .brand-row{display:flex; align-items:center; gap:14px;}
  .brand-logo{width:48px; height:48px; border-radius:50%; box-shadow:0 4px 16px rgba(11,11,14,0.18); flex-shrink:0;}
  .title-block .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--clay); margin-bottom:4px; font-weight:500;}
  .title-block h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(24px,3.6vw,34px); margin:0; line-height:1.05; letter-spacing:-0.02em;}
  .title-block .sub{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .plan-tag{font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; color:var(--ink-soft); line-height:1.6;}
  .plan-tag b{color:var(--ink); font-weight:600;}

  .rail{display:flex; gap:4px; margin:22px 0 6px;}
  .rail .seg{flex:1; height:5px; background:var(--line); cursor:pointer; border-radius:3px;}
  .rail .seg.done{background:var(--clay); opacity:0.45;}
  .rail .seg.active{background:var(--clay);}
  .rail-labels{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); margin-bottom:28px; text-transform:uppercase; letter-spacing:0.05em;}

  .sheet{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:36px clamp(20px,4vw,48px); min-height:420px; position:relative; box-shadow:0 2px 24px rgba(11,11,14,0.04);}
  .sheet::before{content: attr(data-num); position:absolute; top:-14px; left:32px; background:var(--ink); color:var(--paper); font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 12px; letter-spacing:0.06em; border-radius:20px;}
  .step-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; margin:6px 0 6px; letter-spacing:-0.01em;}
  .step-desc{color:var(--ink-soft); font-size:14px; margin-bottom:28px; max-width:680px; line-height:1.6;}

  label.field-label{display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:8px;}
  .field{margin-bottom:22px;}
  input[type=text], input[type=date], textarea{width:100%; border:none; border-bottom:1.5px solid var(--line); background:transparent; font-family:'Inter',sans-serif; font-size:15px; padding:8px 2px; color:var(--ink); outline:none; transition:border-color .2s;}
  input[type=text]:focus, input[type=date]:focus, textarea:focus{border-color:var(--clay);}
  textarea{resize:vertical; min-height:70px; line-height:1.5;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px 28px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  /* ---- estilo arquitectónico cards ---- */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:8px;}
  .vcard{border:1.5px solid var(--line); border-radius:14px; background:var(--cream); cursor:pointer; overflow:hidden; transition:border-color .15s, transform .15s; position:relative;}
  .vcard:hover{transform:translateY(-2px);}
  .vcard.selected{border-color:var(--clay); box-shadow:0 0 0 1px var(--clay);}
  .vcard.selected .check{opacity:1; transform:scale(1);}
  .vcard svg.mock{display:block; width:100%; height:120px; background:var(--line);}
  .vcard .cap{padding:10px 12px 12px; font-size:13px; font-weight:600;}
  .vcard .cap small{display:block; font-weight:400; color:var(--ink-soft); font-size:11px; margin-top:2px;}
  .check{position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:var(--clay); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; opacity:0; transform:scale(0.6); transition:.15s; z-index:2;}

  /* ---- swatch (color chips) ---- */
  .swatch-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:12px; margin-bottom:6px;}
  .swatch{border:1.5px solid transparent; border-radius:var(--radius); cursor:pointer; text-align:center; padding-bottom:2px;}
  .swatch .sq{height:64px; border:1px solid rgba(0,0,0,0.12); border-radius:10px;}
  .swatch .lbl{font-size:10.5px; margin-top:6px; color:var(--ink-soft); line-height:1.3;}
  .swatch.selected{border-color:var(--clay);}
  .swatch.selected .sq{outline:2px solid var(--clay); outline-offset:2px;}

  /* ---- paleta de color psicológica (NUEVO) ---- */
  .palette-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
  .palette-card{border:1.5px solid var(--line); background:var(--cream); margin-bottom:16px; cursor:pointer; transition:border-color .15s; overflow:hidden; border-radius:14px;}
  .palette-card.selected{border-color:var(--clay); box-shadow:0 0 0 1px var(--clay);}
  .palette-top{display:flex; gap:0; flex-wrap:wrap;}
  .palette-imgs{display:flex; flex:0 0 auto;}
  .palette-imgs svg{width:120px; height:100px; display:block; background:var(--line);}
  .palette-info{flex:1; min-width:220px; padding:14px 18px; position:relative;}
  .palette-info .check{position:absolute; top:12px; right:14px;}
  .palette-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; margin:0 0 6px;}
  .palette-chips{display:flex; gap:6px; margin-bottom:10px;}
  .palette-chips .c{width:26px; height:26px; border:1px solid rgba(0,0,0,0.15); flex-shrink:0;}
  .color-slot-empty{display:flex; align-items:center; justify-content:center; background:var(--cream); color:var(--ink-soft); cursor:pointer; font-size:14px; border:1.5px dashed var(--line) !important;}
  .color-slot-empty:hover{border-color:var(--clay) !important; color:var(--clay);}
  .color-picker-row{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .color-picker-row input[type=color]{width:52px; height:38px; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; padding:2px; background:var(--paper);}
  .color-picker-hex{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); min-width:70px;}
  .mood-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px;}
  @media(max-width:640px){.mood-grid{grid-template-columns:repeat(3,1fr);}}
  .mood-slot{aspect-ratio:1; border:1.5px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; cursor:pointer; background:var(--cream); color:var(--line); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;}
  .mood-slot.filled{border-style:solid;}
  .mood-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .mood-slot .remove-x{position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,0.9); color:var(--ink); font-size:11px; display:flex; align-items:center; justify-content:center; z-index:2;}
  .mood-slot input[type=file]{display:none;}
  .office-palette{padding:16px 18px; margin-bottom:16px; cursor:default;}
  .office-palette .palette-info{cursor:pointer;}
  .palette-psych{font-size:12.5px; line-height:1.55; color:var(--ink-soft); max-width:520px;}
  .palette-psych b{color:var(--ink); font-weight:600;}
  @media(max-width:560px){ .palette-imgs svg{width:90px; height:80px;} }

  /* ---- materiales ---- */
  .mat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .mat{border:1.5px solid var(--line); cursor:pointer; overflow:hidden; position:relative; background:var(--cream); border-radius:12px;}
  .mat.selected{border-color:var(--clay); box-shadow:0 0 0 1px var(--clay);}
  .mat .tex{height:80px; width:100%; display:block; border-radius:12px 12px 0 0;}
  .mat .lbl{font-size:12px; font-weight:600; padding:8px 10px 10px; background:var(--paper);}
  .mat .check{width:18px; height:18px; font-size:11px;}

  .pref-row{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
  .pref-row .ends{font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--ink-soft); width:90px; text-transform:uppercase;}
  .pref-row .ends:last-child{text-align:right;}
  input[type=range]{flex:1; accent-color:var(--clay); height:2px;}

  .chip-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{border:1.5px solid var(--line); border-radius:20px; padding:8px 16px; font-size:13px; cursor:pointer; background:var(--cream); transition:.15s; user-select:none; font-weight:500;}
  .chip.small{padding:6px 12px; font-size:11.5px;}
  .func-audit-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin:26px 0 4px;}
  .func-audit-sub{font-size:12px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5;}
  .func-cat{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--clay); margin-top:16px; margin-bottom:8px;}
  .func-chip-grid{margin-bottom:4px;}
  .func-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:10px;}
  .chip.selected{background:var(--clay); color:#fff; border-color:var(--clay);}

  .room{border:1px solid var(--line); margin-bottom:10px; background:var(--cream); border-radius:12px; overflow:hidden;}
  .room-head{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:600; font-size:14px;}
  .room-head .arrow{transition:.2s; font-size:12px; color:var(--ink-soft);}
  .room.open .arrow{transform:rotate(90deg);}
  .room-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .room.open .room-body{max-height:400px;}
  .room-body-inner{padding:0 16px 16px;}

  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:24px;}
  button.btn{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); padding:13px 24px; cursor:pointer; transition:.15s; border-radius:30px;}
  button.btn.ghost{background:transparent; color:var(--ink);}
  button.btn:hover{opacity:0.85; transform:translateY(-1px);}
  button.btn:disabled{opacity:0.25; cursor:not-allowed; transform:none;}
  .step-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);}

  .summary-block{border-top:1px dashed var(--line); padding-top:18px; margin-top:26px;}
  .summary-block h3{font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 10px;}
  .sum-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:13px;}
  .sum-grid .k{color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding-top:10px;}
  .sum-grid .v{padding-bottom:4px;}

  .proj-type-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:8px;}
  @media(max-width:560px){.proj-type-grid{grid-template-columns:1fr;}}
  .proj-type-card{border:1.5px solid var(--line); border-radius:16px; padding:22px 20px; cursor:pointer; background:var(--cream); transition:.15s; position:relative;}
  .proj-type-card:hover{border-color:var(--clay); transform:translateY(-2px);}
  .proj-type-card.selected{border-color:var(--clay); background:var(--clay-soft); box-shadow:0 0 0 1px var(--clay);}
  .proj-type-card.disabled{opacity:0.5; cursor:not-allowed;}
  .proj-type-card.disabled:hover{transform:none; border-color:var(--line);}
  .pt-icon{font-size:26px; margin-bottom:10px; color:var(--clay);}
  .pt-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin-bottom:4px;}
  .pt-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}
  .soon-badge{position:absolute; top:14px; right:14px; font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; background:var(--ink); color:#fff; padding:3px 8px; border-radius:10px;}

  .type-toggle{display:flex; gap:10px; margin-bottom:26px;}
  .type-toggle .opt{flex:1; border:1.5px solid var(--line); padding:16px; text-align:center; cursor:pointer; font-weight:600; font-size:14px; background:var(--cream); border-radius:12px; transition:.15s;}
  .type-toggle .opt.selected{border-color:var(--clay); background:var(--clay); color:#fff;}

  .room-check-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;}
  .room-check{border:1.5px solid var(--line); padding:10px 14px; cursor:pointer; font-size:13px; background:var(--cream); display:flex; align-items:center; gap:8px; border-radius:10px; transition:.15s;}
  .room-check.selected{border-color:var(--sage); background:var(--sage); color:#fff;}
  .room-check .dot{width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor; flex-shrink:0;}
  .room-check.selected .dot{background:#fff;}

  .note{font-size:12px; color:var(--ink-soft); background:var(--clay-soft); border-left:3px solid var(--clay); padding:10px 14px; margin-bottom:22px; line-height:1.5; border-radius:0 10px 10px 0;}

  /* ---- GALERÍA DE ESTILOS (una página por estilo) ---- */
  .style-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:14px;}
  .style-tab{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:9px 16px; border:1px solid var(--line); background:var(--cream); cursor:pointer; color:var(--ink-soft); transition:.15s; border-radius:20px; font-weight:500;}
  .style-tab.active{background:var(--clay); color:#fff; border-color:var(--clay);}
  .style-tab.add-tab{background:transparent; border-style:dashed; color:var(--clay);}
  .style-tab.is-custom{padding-right:10px;}
  .style-tab .tab-remove{display:inline-block; margin-left:6px; opacity:0.6; cursor:pointer;}
  .style-tab .tab-remove:hover{opacity:1;}
  .style-tab.liked::after{content:" ♥"; color:var(--clay);}
  .style-tab.liked.active::after{color:#fff;}

  .style-page-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .style-page-head h2{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:24px; margin:0 0 4px;}
  .style-page-head .mood{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--clay);}
  .btn-like{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; border:1.5px solid var(--ink); background:transparent; padding:10px 16px; cursor:pointer; white-space:nowrap; transition:.15s;}
  .btn-like.on{background:var(--ink); color:var(--paper);}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;}
  @media(max-width:640px){.photo-grid{grid-template-columns:repeat(2,1fr);}}
  .photo-slot{aspect-ratio:4/3; border:1.5px dashed var(--line); background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--ink-soft); font-size:10.5px; text-align:center; cursor:pointer; position:relative; overflow:hidden; padding:6px; border-radius:12px;}
  .photo-slot:hover{border-color:var(--clay); color:var(--clay);}
  .photo-slot .num{font-family:'Space Grotesk',sans-serif; font-size:20px; color:var(--line);}
  .photo-slot.r-like{border-style:solid; border-color:var(--clay); box-shadow:0 0 0 2px var(--clay) inset;}
  .photo-slot.r-super{border-style:solid; border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset;}
  .photo-slot.r-dislike{opacity:0.35;}
  .photo-slot .badge{position:absolute; top:6px; right:6px; font-size:14px; background:rgba(0,0,0,0.55); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .photo-slot .remove-x{position:absolute; top:6px; left:6px; font-size:13px; background:rgba(255,255,255,0.9); color:var(--ink); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:3; opacity:0; transition:.15s; border:1px solid var(--line);}
  .photo-slot:hover .remove-x{opacity:1;}
  .photo-slot .rating-pill{position:absolute; bottom:6px; left:6px; background:rgba(0,0,0,0.6); color:#fff; font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 6px; border-radius:10px;}
  .photo-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .photo-slot input[type=file]{display:none;}

  /* ---- LIGHTBOX (revisión estilo Tinder) ---- */
  .lightbox-overlay{position:fixed; inset:0; background:rgba(18,16,13,0.95); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  .lb-close{position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:26px; cursor:pointer; line-height:1;}
  .lb-progress{position:absolute; top:24px; left:24px; color:#fff; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.05em;}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:22px; width:44px; height:44px; border-radius:50%; cursor:pointer;}
  .lb-nav.prev{left:16px;} .lb-nav.next{right:16px;}
  .lb-nav:hover{background:rgba(255,255,255,0.2);}
  .lb-imgwrap{max-width:560px; width:100%; max-height:50vh; display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .lb-imgwrap img{max-width:100%; max-height:50vh; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,0.6);}
  .lb-actions{display:flex; gap:22px; margin-bottom:20px;}
  .lb-btn{width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; font-size:22px; display:flex; align-items:center; justify-content:center; transition:.15s; background:#3A3733; color:#fff;}
  .lb-btn:hover{transform:scale(1.1);}
  .lb-btn.dislike.active{background:#8B3A3A; box-shadow:0 0 0 3px #fff3;}
  .lb-btn.like{background:var(--clay);}
  .lb-btn.like.active{box-shadow:0 0 0 3px #fff3;}
  .lb-btn.super{background:var(--gold);}
  .lb-btn.super.active{box-shadow:0 0 0 3px #fff3;}
  .lb-panel{background:var(--paper); width:100%; max-width:440px; padding:18px 20px; box-shadow:0 10px 40px rgba(0,0,0,0.4);}
  .lb-panel .field-label{margin-bottom:6px;}
  .lb-panel textarea{min-height:50px; font-size:13px;}
  .lb-save{width:100%; margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; border:none; background:var(--ink); color:var(--paper); padding:12px; cursor:pointer;}

  /* ---- COMPARADOR DE ESTILOS ---- */
  .compare-btn{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; border:1px solid var(--ink); background:transparent; padding:8px 14px; cursor:pointer; margin-left:auto;}
  .compare-overlay{position:fixed; inset:0; background:rgba(18,16,13,0.92); z-index:1000; overflow-y:auto; padding:40px 20px;}
  .compare-inner{max-width:1000px; margin:0 auto; background:var(--paper); padding:28px clamp(18px,4vw,40px);}
  .compare-close{float:right; background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink);}
  .compare-selects{display:flex; gap:16px; margin:18px 0 26px; flex-wrap:wrap;}
  .compare-selects select{flex:1; min-width:180px; font-family:'Inter',sans-serif; font-size:14px; padding:10px; border:1.5px solid var(--line); background:var(--cream);}
  .compare-cols{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media(max-width:640px){.compare-cols{grid-template-columns:1fr;}}
  .compare-col h3{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px;}
  .compare-col .mood{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--clay); text-transform:uppercase; margin-bottom:12px;}
  .compare-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:14px;}
  .compare-photos .ph{aspect-ratio:1; background:var(--line); overflow:hidden; position:relative;}
  .compare-photos .ph img{width:100%; height:100%; object-fit:cover;}
  .compare-photos .ph .st{position:absolute; top:3px; right:3px; font-size:11px;}

  /* ---- RANKING & DUELO ---- */
  .ranking-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .ranking-row .rank-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; width:22px; color:var(--ink-soft);}
  .ranking-row .rank-num.top{color:var(--clay);}
  .ranking-row .rank-name{width:180px; font-size:13px; font-weight:600; flex-shrink:0;}
  .ranking-bar-wrap{flex:1; background:var(--line); border-radius:8px; height:10px; overflow:hidden;}
  .ranking-bar{height:100%; background:var(--clay); border-radius:8px; transition:width .4s;}
  .ranking-score{font-family:'JetBrains Mono',monospace; font-size:11px; width:52px; text-align:right; color:var(--ink-soft); flex-shrink:0;}

  .duel-progress{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); text-align:center; margin-bottom:18px;}
  .duel-pair{display:flex; gap:20px; justify-content:center; align-items:center; margin:10px 0 26px; flex-wrap:wrap;}
  .duel-card{flex:1; min-width:200px; max-width:280px; border:1.5px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; transition:.15s; background:var(--cream);}
  .duel-card:hover{border-color:var(--clay); transform:translateY(-3px); box-shadow:0 10px 24px rgba(11,11,14,0.08);}
  .duel-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
  .duel-card .info{padding:10px 14px 14px;}
  .duel-card .info .sn{font-size:12px; font-weight:600;}
  .duel-card .info .sr{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .duel-vs{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:var(--line);}

  .champion-card{text-align:center; padding:34px 20px; border:2px solid var(--clay); border-radius:20px; background:var(--clay-soft); margin-top:10px;}
  .champion-card .tag{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--clay); margin-bottom:12px;}
  .champion-card img{width:200px; height:200px; object-fit:cover; border-radius:50%; margin-bottom:16px; box-shadow:0 10px 30px rgba(11,11,14,0.18); border:4px solid #fff;}
  .champion-card h3{font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 4px;}
  .champion-card .sr{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}

  .fact-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; margin-bottom:24px;}
  @media(max-width:560px){.fact-grid{grid-template-columns:1fr;}}
  .fact{border-left:2px solid var(--line); padding-left:12px;}
  .fact .fk{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:3px;}
  .fact .fv{font-size:13px; line-height:1.45;}

  .recorder{display:flex; align-items:center; gap:12px; border:1px solid var(--line); padding:12px 16px; background:var(--cream); margin-bottom:10px; flex-wrap:wrap;}
  .rec-btn{width:38px; height:38px; border-radius:50%; border:none; background:var(--clay); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; transition:.15s;}
  .rec-btn.recording{background:#a83232; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,50,50,.5);}70%{box-shadow:0 0 0 10px rgba(168,50,50,0);}100%{box-shadow:0 0 0 0 rgba(168,50,50,0);}}
  .rec-status{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); flex:1; min-width:120px;}
  .rec-audio{max-width:220px; height:32px;}
  .rec-dl{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; text-decoration:none; color:var(--ink); border:1px solid var(--ink); padding:6px 10px;}

  @media print{
    .rail, .nav, .no-print{display:none !important;}
    .blueprint-bg{opacity:0.25;}
    .sheet{border:none; padding:0;}
  }
</style>
</head>

function roomSVG({wall, floor, accent, dark, variant='living'}){
  if(variant==='bedroom'){
    return `<svg class="mock" viewBox="0 0 220 130" xmlns="http://www.w3.org/2000/svg">
      <rect width="220" height="95" fill="${wall}"/>
      <rect y="95" width="220" height="35" fill="${floor}"/>
      <rect x="18" y="45" width="90" height="50" fill="${accent}"/>
      <rect x="18" y="35" width="90" height="12" fill="${dark}"/>
      <rect x="120" y="20" width="34" height="70" fill="${dark}" opacity="0.85"/>
      <rect x="165" y="55" width="40" height="20" fill="${accent}" opacity="0.6"/>
    </svg>`;
  }
  if(variant==='detail'){
    return `<svg class="mock" viewBox="0 0 220 130" xmlns="http://www.w3.org/2000/svg">
      <rect width="220" height="130" fill="${wall}"/>
      <circle cx="60" cy="60" r="34" fill="${accent}"/>
      <rect x="120" y="30" width="70" height="70" fill="${dark}"/>
      <rect x="0" y="108" width="220" height="22" fill="${floor}"/>
    </svg>`;
  }
  /* living default */
  return `<svg class="mock" viewBox="0 0 220 130" xmlns="http://www.w3.org/2000/svg">
    <rect width="220" height="95" fill="${wall}"/>
    <rect y="95" width="220" height="35" fill="${floor}"/>
    <rect x="14" y="60" width="70" height="35" fill="${accent}"/>

    <line x1="0" y1="95" x2="220" y2="95" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  </svg>`;
}

/* ===========================================================
   PASOS — motor dinámico según tipo de proyecto
=========================================================== */
function getSteps(){
  const tipo = state.proyecto.tipoProyecto;
  const list = [
    { label:'Tipo de proyecto', render: renderTipoProyecto, bind: bindTipoProyecto },
    { label:'Datos generales', render: renderInicio, bind: bindInicio },
  ];

  if(tipo==='oficina'){
    list.push({ label:'Espacios', render: renderSeleccionAmbientes, bind: bindSeleccionAmbientes });
    list.push({ label:'La oficina', render: renderOficina, bind: bindOficina });
  } else if(tipo==='ambiente-unico'){
    list.push({ label:'El ambiente', render: renderSeleccionAmbientes, bind: bindSeleccionAmbientes });
  } else {
    /* vivienda (default también antes de elegir tipo) */
    list.push({ label:'Ambientes', render: renderSeleccionAmbientes, bind: bindSeleccionAmbientes });
  }

  if(tipo==='oficina'){
    list.push({ label:'Roles y flujo', render: renderRoles, bind: bindRoles });
  }

  list.push({ label:'Estilo', render: renderEstilo, bind: bindEstilo });
  list.push({ label:'Ranking & Duelo', render: renderDuelo, bind: bindDuelo });
  list.push({ label:'Tipo de mobiliario', render: renderMobiliarioGaleria, bind: bindMobiliarioGaleria });
  list.push({ label:'Paleta de color', render: renderPaleta, bind: bindPaleta });
  list.push({ label:'Materiales', render: renderMateriales, bind: bindMateriales });
  list.push({ label: tipo==='ambiente-unico' ? 'Detalle del ambiente' : 'Detalle x ambiente', render: renderDetalleAmbientes, bind: bindDetalleAmbientes });
  list.push({ label:'Mobiliario', render: renderMobiliario, bind: bindMobiliario });
  list.push({ label:'Presupuesto', render: renderPresupuesto, bind: bindPresupuesto });
  list.push({ label:'Plazos', render: renderPlazos, bind: bindPlazos });
  list.push({ label:'Cierre', render: renderCierre, bind: bindCierre });
  list.push({ label:'Resumen', render: renderResumen, bind: ()=>{} });

  list.forEach((s,i)=> s.num = String(i).padStart(2,'0'));
  return list;
}

let steps = getSteps();
let current = 0;
function rebuildSteps(){
  const prevLen = steps.length;
  steps = getSteps();
  if(current >= steps.length) current = steps.length-1;
}

function buildRail(){
  const rail = document.getElementById('rail'); const labels = document.getElementById('railLabels');
  rail.innerHTML=''; labels.innerHTML='';
  steps.forEach((s,i)=>{
    const seg=document.createElement('div');
    seg.className='seg'+(i<current?' done':'')+(i===current?' active':'');
    seg.onclick=()=>{ current=i; renderStep(); };
    rail.appendChild(seg);
  });
  const first=document.createElement('span'); first.textContent=steps[0].label;
  const last=document.createElement('span'); last.textContent=steps[steps.length-1].label;
  const mid=document.createElement('span'); mid.textContent=steps[current].label; mid.style.color='var(--ink)'; mid.style.fontWeight='600';
  labels.appendChild(first); labels.appendChild(mid); labels.appendChild(last);
}

function renderStep(){
  rebuildSteps();
  const sheet=document.getElementById('sheet');
  sheet.setAttribute('data-num', steps[current].num);
  sheet.innerHTML = steps[current].render();
  buildRail();
  document.getElementById('stepCount').textContent = `Paso ${current+1} de ${steps.length}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===steps.length-1 ? 'Imprimir ficha ↓' : 'Siguiente →';
  const tipoLabel = {vivienda:'Vivienda completa', oficina:'Oficina / local', 'ambiente-unico':'Un solo ambiente'}[state.proyecto.tipoProyecto] || '—';
  document.getElementById('propTag').textContent = tipoLabel + (state.proyecto.direccion ? ' · '+state.proyecto.direccion : '');
  document.getElementById('mainTitle').textContent = state.proyecto.cliente ? `Entrevista — ${state.proyecto.cliente}` : 'Entrevista con el cliente';
  steps[current].bind();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('prevBtn').onclick=()=>{ if(current>0){current--; renderStep();} };
document.getElementById('nextBtn').onclick=()=>{
  if(current===0 && !state.proyecto.tipoProyecto){ renderStep(); return; }
  if(current<steps.length-1){ current++; renderStep(); }
  else { window.print(); }
};

      current = current + 1; /* avanza directo, sin pedir clic en "Siguiente" */
      renderStep();
    };
  });
}

      if(o.dataset.v===state.proyecto.tipo) o.classList.add('selected');
      o.onclick=()=>{
        document.querySelectorAll('#tipo-toggle .opt').forEach(x=>x.classList.remove('selected'));
        o.classList.add('selected');
        state.proyecto.tipo=o.dataset.v;
      };
    });
  }
  const map={'i-cliente':'cliente','i-direccion':'direccion','i-fecha':'fecha','i-m2':'m2','i-integrantes':'integrantes','i-contacto':'contacto'};
  Object.entries(map).forEach(([id,key])=>{
    const el=document.getElementById(id); el.value=state.proyecto[key]||'';
    el.oninput=()=> state.proyecto[key]=el.value;
  });
}

/* ---------- SELECCIÓN DE AMBIENTES (se adapta a vivienda / oficina / ambiente único) ---------- */
function renderSeleccionAmbientes(){
  const tipo = state.proyecto.tipoProyecto;
  let lista, titulo, desc, single=false;

  if(tipo==='oficina'){
    lista = ambientesOficina;
    titulo = '¿Qué espacios tiene la oficina?';
    desc = 'Marcá los espacios que existen y que vamos a intervenir.';
  } else if(tipo==='ambiente-unico'){
    lista = ambientesUnico;
    titulo = '¿Qué ambiente vamos a diseñar?';
    desc = 'Elegí un solo espacio — toda la entrevista se enfoca 100% en él, sin pasos de más.';
    single = true;
  } else {
    lista = state.proyecto.tipo==='Casa' ? ambientesCasa : ambientesDepto;
    titulo = '¿Qué ambientes vamos a diseñar?';
    desc = 'Marcá los ambientes que existen en la propiedad y que van a intervenir. El resto de la entrevista se ajusta a esta selección.';
  }

  return `
    <div class="step-title">${titulo}</div>
    <div class="step-desc">${desc}</div>
    <div class="room-check-grid" id="room-select" data-single="${single}">
      ${lista.map(r=>`<div class="room-check" data-r="${r}"><span class="dot"></span>${r}</div>`).join('')}
    </div>
    ${!single ? `
    <div class="field" style="margin-top:22px;">
      <label class="field-label">Otro ambiente (si no está en la lista)</label>
      <input type="text" id="otro-ambiente" placeholder="Escribir y presionar Enter">
    </div>` : ''}
  `;
}
function bindSeleccionAmbientes(){
  const wrap = document.getElementById('room-select');
  const single = wrap.dataset.single === 'true';
  document.querySelectorAll('#room-select .room-check').forEach(c=>{
    if(state.ambientesSeleccion.includes(c.dataset.r)) c.classList.add('selected');
    c.onclick=()=>{
      const r=c.dataset.r;
      if(single){
        state.ambientesSeleccion = [r];
        renderStep();
        return;
      }
      const i=state.ambientesSeleccion.indexOf(r);
      if(i>-1){state.ambientesSeleccion.splice(i,1); c.classList.remove('selected');}
      else{state.ambientesSeleccion.push(r); c.classList.add('selected');}
    };
  });
  const otro=document.getElementById('otro-ambiente');
  if(otro){
    otro.onkeydown=(e)=>{
      if(e.key==='Enter' && otro.value.trim()){
        state.ambientesSeleccion.push(otro.value.trim());
        otro.value='';
        renderStep();
      }
    };
  }
}

function bindRoles(){
  const nombreInput = document.getElementById('nuevo-rol-nombre');
  document.getElementById('btn-add-rol').onclick=()=>{
    const nombre = nombreInput.value.trim();
    if(!nombre) return;
    const rol = ensureRol();
    rol.nombre = nombre;
    state.roles.push(rol);
    nombreInput.value='';
    renderStep();
  };
  nombreInput.onkeydown=(e)=>{ if(e.key==='Enter') document.getElementById('btn-add-rol').click(); };

  document.querySelectorAll('#roles-list .room').forEach(block=>{
    const id = block.dataset.rol;
    const r = state.roles.find(x=>x.id===id);
    if(!r) return;

    block.querySelector('.room-head').onclick=()=> block.classList.toggle('open');

    const nombreField = block.querySelector('.rol-nombre');
    nombreField.oninput=()=> r.nombre = nombreField.value;
    nombreField.onblur=()=> renderStep();

    block.querySelector('.rol-funcion').oninput=(e)=> r.funcion = e.target.value;
    block.querySelector('.rol-recorrido').oninput=(e)=> r.recorrido = e.target.value;
    block.querySelector('.rol-organizacion').oninput=(e)=> r.organizacion = e.target.value;
    block.querySelector('.rol-conexion-detalle').oninput=(e)=> r.conexionDetalle = e.target.value;
    block.querySelector('.rol-cruces').oninput=(e)=> r.cruces = e.target.value;
    block.querySelector('.rol-notas').oninput=(e)=> r.notas = e.target.value;

    block.querySelectorAll('.rol-recibe .chip').forEach(ch=>{
      ch.onclick=()=>{
        block.querySelectorAll('.rol-recibe .chip').forEach(x=>x.classList.remove('selected'));
        ch.classList.add('selected'); r.recibeClientes = ch.dataset.v;
      };
    });

    const multiGroups = [
      ['.rol-mobiliario', r.mobiliario],
      ['.rol-equipo', r.equipo],
      ['.rol-instalaciones', r.instalaciones],
      ['.rol-almacenamiento', r.almacenamiento],
      ['.rol-tecnologia', r.tecnologia],
      ['.rol-conecta', r.conectaCon],
      ['.rol-confort', r.confort]
    ];
    multiGroups.forEach(([sel, arr])=>{
      block.querySelectorAll(sel + ' .chip').forEach(ch=>{
        ch.onclick=()=>{
          const v = ch.dataset.v; const i = arr.indexOf(v);
          if(i>-1){arr.splice(i,1); ch.classList.remove('selected');}
          else{arr.push(v); ch.classList.add('selected');}
        };
      });
    });

    const removeBtn = block.querySelector('[data-remove-rol]');
    if(removeBtn) removeBtn.onclick=()=>{
      state.roles = state.roles.filter(x=>x.id!==id);
      renderStep();
    };
  });
}

function bindGalleryStep(kind){
  const list = cardsFor(kind);
  const tabIdx = kind==='mobiliario' ? Math.min(mobTabIndex, list.length-1) : Math.min(styleTabIndex, list.length-1);
  const c = list[tabIdx];
  const det = detailFor(kind, c.k);
  const seleccion = seleccionFor(kind);
  const mediaKey = kind + '::' + getStyleContext() + '::' + c.k;

  bindRoomContextSelector();

  document.querySelectorAll('#gallery-tabs .style-tab[data-i]').forEach(t=>{
    t.onclick=(e)=>{
      if(e.target.classList.contains('tab-remove')) return;
      const idx = parseInt(t.dataset.i);
      if(kind==='mobiliario') mobTabIndex=idx; else styleTabIndex=idx;
      renderStep();
    };
    t.ondblclick=(e)=>{
      e.stopPropagation();
      const card = list[parseInt(t.dataset.i)];
      const nuevo = window.prompt('Renombrar:', card.t);
      if(nuevo && nuevo.trim()){ card.t = nuevo.trim(); renderStep(); }
    };
  });
  document.querySelectorAll('.tab-remove').forEach(x=>{
    x.onclick=(e)=>{
      e.stopPropagation();
      const k = e.target.dataset.removeK;
      const ctx = getStyleContext();
      const store = personalizadosFor(kind);
      if(store[ctx]) store[ctx] = store[ctx].filter(card=>card.k!==k);
      if(kind==='mobiliario') mobTabIndex=0; else styleTabIndex=0;
      renderStep();
    };
  });
  document.getElementById('btn-add-card').onclick=()=>{
    const nombre = window.prompt('Nombre del nuevo ' + (kind==='mobiliario' ? 'tipo de mobiliario' : 'estilo') + ':');
    if(!nombre || !nombre.trim()) return;
    const ctx = getStyleContext();
    const store = personalizadosFor(kind);
    if(!store[ctx]) store[ctx]=[];
    const k = 'custom-' + Date.now();
    store[ctx].push({k, t:nombre.trim(), mood:'Personalizado', d:'Agregado por el estudio', custom:true, facts:[
      {k:'De qué se trata', v:'Definilo con tus propias palabras durante la reunión.'},
      {k:'Materiales típicos', v:'—'}, {k:'Ideal para', v:'—'}, {k:'Cuidado con', v:'—'}
    ]});
    const newIdx = cardsFor(kind).length - 1;
    if(kind==='mobiliario') mobTabIndex=newIdx; else styleTabIndex=newIdx;
    renderStep();
  };
  document.getElementById('btn-compare').onclick=()=> openCompare(kind);

  document.getElementById('btn-select-card').onclick=()=>{
    const idx = seleccion.indexOf(c.k);
    if(idx>-1) seleccion.splice(idx,1); else seleccion.push(c.k);
    renderStep();
  };

  document.querySelectorAll('#photo-grid .photo-slot').forEach(slot=>{
    const i = parseInt(slot.dataset.i);
    const input = slot.querySelector('input[type=file]');
    const removeBtn = slot.querySelector('.remove-x');
    slot.onclick=()=>{
      if(det.fotos[i]){ openLightbox(kind, c.k, i); }
      else{ input.click(); }
    };
    if(removeBtn){
      removeBtn.onclick=(e)=>{ e.stopPropagation(); det.fotos[i]=null; renderStep(); };
    }
    input.onclick=(e)=> e.stopPropagation();
    input.onchange=(e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload=(ev)=>{ det.fotos[i] = {dataUrl: ev.target.result, reaction:null, rating:null, comment:""}; renderStep(); };
      reader.readAsDataURL(file);
    };
  });

  const notes = document.getElementById('gallery-notes'); notes.value = det.notas;
  notes.oninput = ()=> det.notas = notes.value;

  renderAudioList(kind, c.k);
  bindRecorder(kind, c.k);
}

function renderAudioList(kind, key){
  const det = detailFor(kind, key);
  const list = document.getElementById('audio-list');

  list.innerHTML = det.audios.map((a)=>`
    <div class="recorder" style="margin-top:8px;">
      <audio class="rec-audio" controls src="${a.url}"></audio>

    </div>
  `).join('');

function bindRecorder(kind, key){
  const det = detailFor(kind, key);
  const btn = document.getElementById('rec-btn');
  const status = document.getElementById('rec-status');
  if(!btn) return;
  const mediaKey = kind + '::' + getStyleContext() + '::' + key;

  btn.onclick = async ()=>{
    if(!mediaRecorders[mediaKey] || mediaRecorders[mediaKey].state!=='recording'){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = e=> chunks.push(e.data);
        recorder.onstop = ()=>{
          const blob = new Blob(chunks, {type:'audio/webm'});
          const url = URL.createObjectURL(blob);
          const name = `nota_${kind}_${key}_${det.audios.length+1}.webm`;
          det.audios.push({url, name});
          stream.getTracks().forEach(t=>t.stop());
          btn.classList.remove('recording'); btn.textContent='●';
          status.textContent='Grabar comentario del cliente';
          renderAudioList(kind, key);
        };
        recorder.start();
        mediaRecorders[mediaKey] = recorder;
        btn.classList.add('recording'); btn.textContent='■';
        status.textContent='Grabando... clic para detener';
      }catch(err){
        status.textContent='No se pudo acceder al micrófono (revisá permisos del navegador).';
      }
    } else {
      mediaRecorders[mediaKey].stop();
    }
  };
}

/* ---------- LIGHTBOX ESTILO TINDER (genérico: estilo o mobiliario) ---------- */
function filledIndexes(det){
  const arr=[]; det.fotos.forEach((f,i)=>{ if(f) arr.push(i); }); return arr;
}
function openLightbox(kind,key,i){ lb={kind,key,i}; renderLightbox(); }
function closeLightbox(){ lb=null; document.getElementById('lightbox-root').innerHTML=''; renderStep(); }
function lbMove(dir){
  const det = detailFor(lb.kind, lb.key);
  const idxs = filledIndexes(det);
  const pos = idxs.indexOf(lb.i);
  const newPos = pos + dir;
  if(newPos>=0 && newPos<idxs.length){ lb.i = idxs[newPos]; renderLightbox(); }
  else if(newPos>=idxs.length){ closeLightbox(); }
}
function lbSetReaction(type){
  const det = detailFor(lb.kind, lb.key);
  const f = det.fotos[lb.i];
  f.reaction = type;
  if(type==='dislike'){ f.rating=null; f.comment=""; renderLightbox(); setTimeout(()=>lbMove(1), 350); }
  else { if(f.rating==null) f.rating=7; renderLightbox(); }
}
function renderLightbox(){
  const root = document.getElementById('lightbox-root');
  if(!lb){ root.innerHTML=''; return; }
  const det = detailFor(lb.kind, lb.key);
  const f = det.fotos[lb.i];
  const idxs = filledIndexes(det);
  const pos = idxs.indexOf(lb.i);
  const card = cardsFor(lb.kind).find(s=>s.k===lb.key);
  const cardName = card ? card.t : lb.key;
  const showPanel = f.reaction==='like' || f.reaction==='super';
  root.innerHTML = `
    <div class="lightbox-overlay">
      <button class="lb-close" id="lb-close">×</button>
      <div class="lb-progress">${cardName} · ${getStyleContext()} · foto ${pos+1} de ${idxs.length}</div>
      ${pos>0 ? '<button class="lb-nav prev" id="lb-prev">‹</button>' : ''}
      ${pos<idxs.length-1 ? '<button class="lb-nav next" id="lb-next">›</button>' : ''}
      <div class="lb-imgwrap"><img src="${f.dataUrl}" alt="Referencia"></div>
      <input type="file" accept="image/*" id="lb-replace-input" style="display:none;">
      <button class="compare-btn" id="lb-replace-btn" style="margin-bottom:16px; background:rgba(255,255,255,0.12); color:#fff; border-color:rgba(255,255,255,0.3);">Reemplazar esta foto</button>
      <div class="lb-actions">
        <button class="lb-btn dislike ${f.reaction==='dislike'?'active':''}" id="lb-dislike" title="No le gusta">✕</button>
        <button class="lb-btn like ${f.reaction==='like'?'active':''}" id="lb-like" title="Le gusta">♥</button>
        <button class="lb-btn super ${f.reaction==='super'?'active':''}" id="lb-super" title="Le encanta">★</button>
      </div>
      ${showPanel ? `
        <div class="lb-panel">
          <label class="field-label">Puntaje (0-10)</label>
          <div class="pref-row" style="margin-bottom:14px;">
            <span class="ends">0</span>
            <input type="range" id="lb-rating" min="0" max="10" value="${f.rating}">
            <span class="ends" id="lb-rating-val" style="width:30px;">${f.rating}</span>
          </div>
          <label class="field-label">Comentario opcional</label>
          <textarea id="lb-comment" placeholder="Ej: le encantó el mueble, no tanto el color de pared...">${f.comment||''}</textarea>
          <button class="lb-save" id="lb-save">Guardar ${pos<idxs.length-1?'y siguiente →':''}</button>
        </div>
      ` : ''}
    </div>
  `;
  document.getElementById('lb-close').onclick = closeLightbox;
  if(document.getElementById('lb-prev')) document.getElementById('lb-prev').onclick=()=>lbMove(-1);
  if(document.getElementById('lb-next')) document.getElementById('lb-next').onclick=()=>lbMove(1);
  document.getElementById('lb-dislike').onclick=()=> lbSetReaction('dislike');
  document.getElementById('lb-like').onclick=()=> lbSetReaction('like');
  document.getElementById('lb-super').onclick=()=> lbSetReaction('super');
  document.getElementById('lb-replace-btn').onclick=()=> document.getElementById('lb-replace-input').click();
  document.getElementById('lb-replace-input').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{ f.dataUrl=ev.target.result; f.reaction=null; f.rating=null; f.comment=""; renderLightbox(); };
    reader.readAsDataURL(file);
  };
  if(showPanel){
    const rating=document.getElementById('lb-rating'); const val=document.getElementById('lb-rating-val');
    rating.oninput=()=>{ f.rating=parseInt(rating.value); val.textContent=rating.value; };
    const comment=document.getElementById('lb-comment');
    comment.oninput=()=> f.comment=comment.value;
    document.getElementById('lb-save').onclick=()=> lbMove(1);
  }
}

/* ---------- 03 PALETA DE COLOR + PSICOLOGÍA (paso central) ---------- */
/* ---------- 03 RANKING AUTOMÁTICO + DUELO DE FAVORITOS (solo estilo arquitectónico) ---------- */
let duelState = null;

function buildDuelPool(){
  const pool=[];
  getStyleCards().forEach(c=>{
    const det = ensureStyleDetail(c.k);
    det.fotos.forEach((f)=>{
      if(f && (f.reaction==='like'||f.reaction==='super') && f.rating!=null && f.rating>=6){
        pool.push({styleKey:c.k, styleName:c.t, dataUrl:f.dataUrl, rating:f.rating, reaction:f.reaction});
      }
    });
  });
  return pool;
}
function makeDuelPairs(items){
  const pairs=[]; let bye=null;
  for(let idx=0; idx<items.length; idx+=2){
    if(idx+1<items.length) pairs.push([items[idx], items[idx+1]]);
    else bye=items[idx];
  }
  return {pairs, bye};
}
function startDuel(){
  const pool = buildDuelPool();
  if(pool.length<2){ duelState={notEnough:true}; return; }
  const sorted = pool.slice().sort((a,b)=>b.rating-a.rating);
  const {pairs, bye} = makeDuelPairs(sorted);
  duelState = { pairs, pairIndex:0, winners: bye?[bye]:[], champion:null, roundNum:1 };
}
function duelPick(winner){
  duelState.winners.push(winner);
  duelState.pairIndex++;
  if(duelState.pairIndex >= duelState.pairs.length){
    if(duelState.winners.length===1){
      duelState.champion = duelState.winners[0];
    } else {
      const {pairs, bye} = makeDuelPairs(duelState.winners);
      duelState.pairs = pairs; duelState.pairIndex = 0;
      duelState.winners = bye ? [bye] : []; duelState.roundNum++;
    }
  }
  renderStep();
}
function resetDuel(){ duelState=null; renderStep(); }

function computeRanking(){
  return getStyleCards().map(c=>{
    const det = ensureStyleDetail(c.k);
    const rated = det.fotos.filter(f=>f && (f.reaction==='like'||f.reaction==='super') && f.rating!=null);
    const avg = rated.length ? rated.reduce((s,f)=>s+f.rating,0)/rated.length : 0;
    return { key:c.k, name:c.t, avg, count:rated.length };
  }).filter(r=>r.count>0).sort((a,b)=>b.avg-a.avg);
}


function renderDuelo(){
  const ranking = computeRanking();
  const maxAvg = Math.max(...ranking.map(r=>r.avg), 1);
  return `
    <div class="step-title">Ranking automático & duelo de favoritos</div>
    <div class="step-desc">Con lo que calificaron en el paso anterior armamos dos cosas: un ranking automático de estilos según puntaje promedio, y un duelo cara a cara entre las fotos mejor calificadas (6+/10) de todas las categorías — como para definir, en vivo, cuál es LA favorita absoluta.</div>

    <label class="field-label">Ranking automático de estilos</label>
    ${ranking.length ? ranking.map((r,i)=>`
      <div class="ranking-row">
        <div class="rank-num ${i===0?'top':''}">${i+1}</div>
        <div class="rank-name">${r.name}</div>
        <div class="ranking-bar-wrap"><div class="ranking-bar" style="width:${(r.avg/maxAvg*100).toFixed(0)}%"></div></div>
        <div class="ranking-score">${r.avg.toFixed(1)}/10</div>
      </div>
    `).join('') : `<div class="note">Todavía no hay fotos calificadas con ♥ o ★ en el paso anterior — volvé a "Estilo" y calificá algunas para ver el ranking acá.</div>`}

    <label class="field-label" style="margin-top:28px; display:block;">Duelo de favoritos</label>
    <div id="duel-zone"></div>
  `;
}

function renderDuelZone(){
  const zone = document.getElementById('duel-zone');
  if(!zone) return;

  if(!duelState){
    const pool = buildDuelPool();
    zone.innerHTML = `
      <div class="step-desc" style="margin-bottom:16px;">${pool.length} foto(s) calificadas con 6+ puntos, listas para el duelo.</div>
      <button class="btn" id="btn-start-duel" ${pool.length<2?'disabled':''}>Iniciar duelo →</button>
      ${pool.length<2 ? '<div class="note" style="margin-top:16px;">Se necesitan al menos 2 fotos con 6+ puntos en distintas fotos para poder enfrentarlas.</div>' : ''}
    `;
    const btn = document.getElementById('btn-start-duel');
    if(btn) btn.onclick=()=>{ startDuel(); renderDuelZone(); };
    return;
  }

  if(duelState.notEnough){
    zone.innerHTML = `<div class="note">Se necesitan al menos 2 fotos con 6+ puntos para poder armar un duelo. Volvé al paso "Estilo" y calificá más fotos.</div>`;
    return;
  }

  if(duelState.champion){
    const ch = duelState.champion;
    zone.innerHTML = `
      <div class="champion-card">
        <div class="tag">★ Favorita absoluta de la reunión</div>
        <img src="${ch.dataUrl}" alt="Foto ganadora">
        <h3>${ch.styleName}</h3>
        <div class="sr">Calificada ${ch.rating}/10 · ${ch.reaction==='super'?'Le encantó':'Le gustó'}</div>
      </div>
      <button class="btn ghost" id="btn-reset-duel" style="margin-top:16px;">Repetir duelo</button>
    `;
    document.getElementById('btn-reset-duel').onclick=()=>{ resetDuel(); renderDuelZone(); };
    return;
  }

  const pair = duelState.pairs[duelState.pairIndex];
  const totalPairsAllRounds = duelState.pairs.length;
  zone.innerHTML = `
    <div class="duel-progress">Ronda ${duelState.roundNum} · enfrentamiento ${duelState.pairIndex+1} de ${totalPairsAllRounds}</div>
    <div class="duel-pair">
      <div class="duel-card" data-side="a">
        <img src="${pair[0].dataUrl}">
        <div class="info"><div class="sn">${pair[0].styleName}</div><div class="sr">${pair[0].rating}/10 ${pair[0].reaction==='super'?'★':'♥'}</div></div>
      </div>
      <div class="duel-vs">VS</div>
      <div class="duel-card" data-side="b">
        <img src="${pair[1].dataUrl}">
        <div class="info"><div class="sn">${pair[1].styleName}</div><div class="sr">${pair[1].rating}/10 ${pair[1].reaction==='super'?'★':'♥'}</div></div>
      </div>
    </div>
  `;
  zone.querySelector('[data-side="a"]').onclick=()=> duelPick(pair[0]);
  zone.querySelector('[data-side="b"]').onclick=()=> duelPick(pair[1]);

          <div class="palette-chips">
            ${(isCustom ? [0,1,2,3] : p.colores.map((c,i)=>i)).map(i=>{
              const c = p.colores[i];
              if(c) return `<div class="c" style="background:${c.h}" title="${c.n}"></div>`;

            }).join('')}

        ${det.fotos.map((f,i)=>`
          <div class="mood-slot ${f?'filled':''}" data-i="${i}">
            ${f ? `<img src="${f}" alt="ref ${i+1}"><span class="remove-x" data-remove="${i}">×</span>` : `<span class="num">${i+1}</span>`}
            <input type="file" accept="image/*" data-i="${i}">
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function bindPaletaOficina(){
  document.querySelectorAll('#office-palette-list .office-palette').forEach(card=>{
    const k = card.dataset.k;
    card.querySelector('.palette-info').onclick=(e)=>{
      if(e.target.closest('.color-slot-empty') || e.target.closest('.tab-remove')) return;
      const i = state.paletaOficina.seleccion.indexOf(k);
      if(i>-1) state.paletaOficina.seleccion.splice(i,1); else state.paletaOficina.seleccion.push(k);
      renderStep();
    };
    const removeBtn = card.querySelector('.tab-remove');
    if(removeBtn) removeBtn.onclick=(e)=>{
      e.stopPropagation();
      state.paletaOficina.personalizadas = state.paletaOficina.personalizadas.filter(p=>p.key!==k);
      renderStep();
    };
    card.querySelectorAll('.color-slot-empty').forEach(slot=>{
      slot.onclick=(e)=>{
        e.stopPropagation();
        const idx = parseInt(slot.dataset.addcolorI);
        const pk = slot.dataset.addcolorK;
        const input = document.createElement('input');
        input.type='color'; input.style.position='fixed'; input.style.opacity='0';
        document.body.appendChild(input);
        input.click();
        input.onchange=()=>{
          const palette = getOfficePalettes().find(p=>p.key===pk);
          palette.colores[idx] = {n:input.value.toUpperCase(), h:input.value};
          document.body.removeChild(input);
          renderStep();
        };
      };
    });

    const det = ensurePaletteOficinaDetail(k);
    card.querySelectorAll('.mood-slot').forEach(slot=>{
      const i = parseInt(slot.dataset.i);
      const input = slot.querySelector('input[type=file]');
      const removeX = slot.querySelector('.remove-x');
      slot.onclick=(e)=>{
        if(e.target===removeX) return;
        if(!det.fotos[i]) input.click();
      };
      if(removeX) removeX.onclick=(e)=>{ e.stopPropagation(); det.fotos[i]=null; renderStep(); };
      input.onclick=(e)=> e.stopPropagation();
      input.onchange=(e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload=(ev)=>{ det.fotos[i]=ev.target.result; renderStep(); };
        reader.readAsDataURL(file);
      };
    });
  });

  document.getElementById('btn-add-office-palette').onclick=()=>{
    const nombre = window.prompt('Nombre de la nueva paleta:');
    if(!nombre || !nombre.trim()) return;
    const key = 'custom-palette-' + Date.now();
    state.paletaOficina.personalizadas.push({key, nombre:nombre.trim(), colores:[], uso:'', custom:true});
    renderStep();
  };

  document.getElementById('i-tono').oninput=(e)=> state.paleta.calidoFrio=e.target.value;
  bindColorPicker((hex)=>{
    if(!state.paleta.customColores.find(c=>c.h.toUpperCase()===hex)){
      state.paleta.customColores.push({n:hex, h:hex});
    }
    renderStep();
  });
  const notas=document.getElementById('i-color-notas'); notas.value=state.paleta.notas;
  notas.oninput=()=> state.paleta.notas=notas.value;
}

function bindPaleta(){
  if(state.proyecto.tipoProyecto==='oficina'){ bindPaletaOficina(); return; }
  document.querySelectorAll('#palette-list .palette-card').forEach(c=>{
    if(state.paleta.seleccion.includes(c.dataset.k)) c.classList.add('selected');
    c.onclick=()=>{
      const k=c.dataset.k; const i=state.paleta.seleccion.indexOf(k);
      if(i>-1){state.paleta.seleccion.splice(i,1); c.classList.remove('selected');}
      else{state.paleta.seleccion.push(k); c.classList.add('selected');}
    };
  });
  document.getElementById('i-tono').oninput=(e)=> state.paleta.calidoFrio=e.target.value;
  bindColorPicker((hex)=>{
    if(!state.paleta.customColores.find(c=>c.h.toUpperCase()===hex)){
      state.paleta.customColores.push({n:hex, h:hex});
    }
    renderStep();
  });
  document.querySelectorAll('#base-swatches .swatch').forEach(s=>{
    if(state.paleta.base.includes(s.dataset.n)) s.classList.add('selected');
    s.onclick=()=>{ const n=s.dataset.n; const i=state.paleta.base.indexOf(n);
      if(i>-1){state.paleta.base.splice(i,1); s.classList.remove('selected');} else{state.paleta.base.push(n); s.classList.add('selected');} };
  });
  document.querySelectorAll('#avoid-swatches .swatch').forEach(s=>{
    if(state.paleta.evitar.includes(s.dataset.n)) s.classList.add('selected');
    s.onclick=()=>{ const n=s.dataset.n; const i=state.paleta.evitar.indexOf(n);
      if(i>-1){state.paleta.evitar.splice(i,1); s.classList.remove('selected');} else{state.paleta.evitar.push(n); s.classList.add('selected');} };
  });
  const notas=document.getElementById('i-color-notas'); notas.value=state.paleta.notas;
  notas.oninput=()=> state.paleta.notas=notas.value;
}

function matchRoomProfile(room){
  const n = room.toLowerCase();
  if(n.includes('cocina') && !n.includes('kitchenette')) return roomProfiles.cocina;
  if(n.includes('dormitorio')) return roomProfiles.dormitorio;
  if(n.includes('baño') || n.includes('bano')) return roomProfiles.bano;
  if(n.includes('comedor')) return roomProfiles.comedor;
  if(n.includes('living') || n.includes('estar')) return roomProfiles.living;
  if(n.includes('home office')) return roomProfiles.homeoffice;
  if(n.includes('balcón') || n.includes('balcon') || n.includes('terraza')) return roomProfiles.balcon;
  if(n.includes('recepción')||n.includes('recepcion')||n.includes('puestos')||n.includes('reunion')||n.includes('gerencia')||n.includes('kitchenette')||n.includes('espera')||n.includes('break room')||n.includes('depósito')||n.includes('deposito')||n.includes('archivo')) return roomProfiles.oficinaEspacio;
  return roomProfiles.otro;
}

}

function bindDetalleAmbientes(){
  document.querySelectorAll('#rooms .room').forEach(roomEl=>{
    const room = roomEl.dataset.r;
    const det = ensureRoomDetail(room);
    roomEl.querySelector('.room-head').onclick=()=> roomEl.classList.toggle('open');

    const comprarTa = roomEl.querySelector('.rd-comprar');
    if(comprarTa) comprarTa.oninput=()=> det.comprarNotas = comprarTa.value;

    roomEl.querySelectorAll('.rd-mobiliario .chip').forEach(ch=>{
      ch.onclick=()=>{
        const v=ch.dataset.v; const i=det.mobiliario.indexOf(v);
        if(i>-1){det.mobiliario.splice(i,1); ch.classList.remove('selected');}
        else{det.mobiliario.push(v); ch.classList.add('selected');}
      };
    });
    roomEl.querySelectorAll('.rd-iluminacion .chip').forEach(ch=>{
      ch.onclick=()=>{
        const v=ch.dataset.v; const i=det.iluminacion.indexOf(v);
        if(i>-1){det.iluminacion.splice(i,1); ch.classList.remove('selected');}
        else{det.iluminacion.push(v); ch.classList.add('selected');}
      };
    });
    roomEl.querySelectorAll('.rd-q').forEach(ta=>{
      const qid = ta.dataset.qid;
      ta.oninput=()=>{ det.respuestas[qid]=ta.value; };
    });
    const funcContainer = roomEl.querySelector('.rd-funcional');
    if(funcContainer) bindFuncionalGroups(funcContainer, det.funcional);
  });
}

function bindChipGroup(containerId, setter, current){
  document.querySelectorAll('#'+containerId+' .chip').forEach(ch=>{

  });
}

      <div class="k">Integrantes / usuarios</div><div class="v">${s.proyecto.integrantes||'—'}</div>
      <div class="k">Contacto</div><div class="v">${s.proyecto.contacto||'—'}</div>
      <div class="k">Ambientes a intervenir</div><div class="v">${s.ambientesSeleccion.join(', ')||'—'}</div>
    </div></div>

    ${s.proyecto.tipoProyecto==='oficina' ? `
    <div class="summary-block"><h3>Datos de la oficina</h3><div class="sum-grid">
      <div class="k">Personas / puestos</div><div class="v">${s.oficina.personas||'—'}</div>
      <div class="k">Horario de uso</div><div class="v">${s.oficina.horario||'—'}</div>
      <div class="k">Modalidad</div><div class="v">${s.oficina.modalidad||'—'}</div>
      <div class="k">Sala de reuniones</div><div class="v">${s.oficina.salaReuniones||'—'}</div>
      <div class="k">Recibe visitas/clientes</div><div class="v">${s.oficina.visitas||'—'}</div>
      <div class="k">Prioridad acústica</div><div class="v">${s.oficina.acustica||'—'}</div>
      <div class="k">Identidad de marca</div><div class="v">${s.oficina.identidadMarca||'—'}</div>
      <div class="k">Tecnología</div><div class="v">${s.oficina.tecnologia||'—'}</div>
      <div class="k">Auditoría funcional/ergonómica</div><div class="v">${s.oficina.funcional.join(' · ')||'—'}</div>
    </div></div>

    <div class="summary-block"><h3>Roles y flujo de trabajo</h3>
      ${s.roles.length ? s.roles.map(r=>`
        <div style="margin-bottom:14px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:4px;">${r.nombre || '(sin nombre)'}</div>
          <div class="sum-grid">
            <div class="k">Función</div><div class="v">${r.funcion||'—'}</div>
            <div class="k">Recibe clientes</div><div class="v">${r.recibeClientes||'—'}</div>
            <div class="k">Recorrido del cliente</div><div class="v">${r.recorrido||'—'}</div>
            <div class="k">Mobiliario</div><div class="v">${r.mobiliario.join(', ')||'—'}</div>
            <div class="k">Equipo</div><div class="v">${(r.equipo||[]).join(', ')||'—'}</div>
            <div class="k">Instalaciones</div><div class="v">${(r.instalaciones||[]).join(', ')||'—'}</div>
            <div class="k">Almacenamiento</div><div class="v">${r.almacenamiento.join(', ')||'—'}</div>
            <div class="k">Organización</div><div class="v">${r.organizacion||'—'}</div>
            <div class="k">Tecnología</div><div class="v">${r.tecnologia.join(', ')||'—'}</div>
            <div class="k">Conecta con</div><div class="v">${(r.conectaCon||[]).map(id=>{const o=s.roles.find(x=>x.id===id); return o?o.nombre:null;}).filter(Boolean).join(', ')||'—'}</div>
            <div class="k">Detalle de la conexión</div><div class="v">${r.conexionDetalle||'—'}</div>
            <div class="k">Cruces de circulación</div><div class="v">${r.cruces||'—'}</div>
            <div class="k">Confort</div><div class="v">${r.confort.join(', ')||'—'}</div>
            <div class="k">Notas</div><div class="v">${r.notas||'—'}</div>
          </div>
        </div>
      `).join('') : '<div class="sum-grid"><div class="v">No se agregaron roles.</div></div>'}
    </div>` : ''}

    <div class="summary-block"><h3>Estilo arquitectónico</h3><div class="sum-grid">
      <div class="k">Dirección elegida</div><div class="v">${s.estilo.seleccion.map(k=>styleNames[k]).join(', ')||'—'}</div>
      <div class="k">Atemporal / tendencia</div><div class="v">${s.estilo.atemporalidad}/10</div>
      <div class="k">Densidad</div><div class="v">${s.estilo.densidad}</div>
      <div class="k">Referencias</div><div class="v">${s.estilo.refs||'—'}</div>
    </div></div>

    <div class="summary-block"><h3>Detalle por estilo (por espacio)</h3>
      ${Object.keys(s.estiloDetalle).filter(fk=>{const d=s.estiloDetalle[fk]; return d && (d.notas || d.audios.length || (d.fotos||[]).some(f=>f&&f.reaction));}).map(fullKey=>{
        const [ctx, styleKey] = fullKey.split('::');
        const d = s.estiloDetalle[fullKey];
        const rated = (d.fotos||[]).filter(f=>f && (f.reaction==='like'||f.reaction==='super'));
        const discarded = (d.fotos||[]).filter(f=>f && f.reaction==='dislike').length;
        const fotoLines = rated.map((f)=>`<div class="k">${f.reaction==='super'?'★ Le encantó':'♥ Le gustó'} (${f.rating}/10)</div><div class="v">${f.comment||'sin comentario'}</div>`).join('');
        return `<div style="margin-bottom:14px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:4px;">${ctx} — ${styleNames[styleKey]||styleKey} ${state.estilo.seleccion.includes(styleKey)?'★ elegido':''}</div>
          <div class="sum-grid">
            <div class="k">Fotos revisadas</div><div class="v">${rated.length} bien calificadas, ${discarded} descartadas, de ${(d.fotos||[]).filter(f=>f).length} subidas</div>
            ${fotoLines}
            <div class="k">Notas generales</div><div class="v">${d.notas||'—'}</div>
            <div class="k">Audios</div><div class="v">${d.audios.length ? d.audios.map(a=>`<a href="${a.url}" download="${a.name}">${a.name}</a>`).join(', ') : '—'}</div>
          </div>
        </div>`;
      }).join('') || '<div class="sum-grid"><div class="v">—</div></div>'}
    </div>

    <div class="summary-block"><h3>Mobiliario preferido (por espacio)</h3><div class="sum-grid">
      <div class="k">Tipos elegidos</div><div class="v">${s.mobiliarioGaleria.seleccion.map(k=>mobNames[k]).join(', ')||'—'}</div>
    </div>
      ${Object.keys(s.mobiliarioGaleria.detalle).filter(fk=>{const d=s.mobiliarioGaleria.detalle[fk]; return d && (d.notas || d.audios.length || (d.fotos||[]).some(f=>f&&f.reaction));}).map(fullKey=>{
        const [ctx, mobKey] = fullKey.split('::');
        const d = s.mobiliarioGaleria.detalle[fullKey];
        const rated = (d.fotos||[]).filter(f=>f && (f.reaction==='like'||f.reaction==='super'));
        const fotoLines = rated.map((f)=>`<div class="k">${f.reaction==='super'?'★ Le encantó':'♥ Le gustó'} (${f.rating}/10)</div><div class="v">${f.comment||'sin comentario'}</div>`).join('');
        return `<div style="margin-bottom:14px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:4px;">${ctx} — ${mobNames[mobKey]||mobKey}</div>
          <div class="sum-grid">
            ${fotoLines}
            <div class="k">Notas</div><div class="v">${d.notas||'—'}</div>
          </div>
        </div>`;
      }).join('') || ''}
    </div>

    <div class="summary-block"><h3>Ranking automático & duelo</h3><div class="sum-grid">
      <div class="k">Ranking de estilos</div><div class="v">${computeRanking().map((r,i)=>`${i+1}. ${r.name} (${r.avg.toFixed(1)}/10)`).join(' · ')||'—'}</div>
      <div class="k">Favorita absoluta (duelo)</div><div class="v">${duelState && duelState.champion ? `${duelState.champion.styleName} — ${duelState.champion.rating}/10` : 'aún no se jugó el duelo'}</div>
    </div></div>

    <div class="summary-block"><h3>Paleta de color</h3><div class="sum-grid">
      <div class="k">Paleta(s) elegida(s)</div><div class="v">${s.paleta.seleccion.map(k=>paletteNames[k]).join(', ')||'—'}</div>
      <div class="k">Frío / cálido</div><div class="v">${s.paleta.calidoFrio}/10</div>
      <div class="k">Colores puntuales que gustan</div><div class="v">${s.paleta.base.join(', ')||'—'}</div>
      <div class="k">Colores a evitar</div><div class="v">${s.paleta.evitar.join(', ')||'—'}</div>
      <div class="k">Colores elegidos libremente</div><div class="v">${s.paleta.customColores.map(c=>c.h).join(', ')||'—'}</div>
      <div class="k">Notas</div><div class="v">${s.paleta.notas||'—'}</div>
    </div>
    ${s.proyecto.tipoProyecto==='oficina' ? `
      <div style="margin-top:14px;">
        <div class="k" style="margin-bottom:6px;">Paletas de oficina elegidas</div>
        ${getOfficePalettes().filter(p=>s.paletaOficina.seleccion.includes(p.key) || (s.paletaOficina.detalle[p.key]&&s.paletaOficina.detalle[p.key].fotos.some(f=>f))).map(p=>{
          const det = s.paletaOficina.detalle[p.key];
          const fotosCount = det ? det.fotos.filter(f=>f).length : 0;
          return `<div class="sum-grid" style="margin-bottom:8px;">
            <div class="k">${p.nombre}${s.paletaOficina.seleccion.includes(p.key)?' ★':''}</div>
            <div class="v">${p.colores.map(c=>c?c.h:'').filter(Boolean).join(', ')||'sin colores definidos'} — ${fotosCount} foto(s) en el moodboard</div>
          </div>`;
        }).join('') || '<div class="sum-grid"><div class="v">—</div></div>'}
      </div>
    ` : ''}
    </div>

    <div class="summary-block"><h3>Materiales</h3><div class="sum-grid">
      <div class="k">Seleccionados</div><div class="v">${s.materiales.seleccion.join(', ')||'—'}</div>
      <div class="k">Notas</div><div class="v">${s.materiales.notas||'—'}</div>
    </div></div>

    <div class="summary-block"><h3>Ambientes</h3>${roomLines || '<div class="sum-grid"><div class="v">—</div></div>'}</div>

    <div class="summary-block"><h3>Mobiliario existente</h3><div class="sum-grid">
      <div class="k">Reutilizar</div><div class="v">${s.mobiliario.reutilizar||'—'}</div>
      <div class="k">No negociables</div><div class="v">${s.mobiliario.noNegociables||'—'}</div>
      <div class="k">Electrodomésticos</div><div class="v">${s.mobiliario.electrodomesticos||'—'}</div>
      <div class="k">Arte / objetos</div><div class="v">${s.mobiliario.arte||'—'}</div>
    </div></div>

    <div class="summary-block"><h3>Presupuesto y plazos</h3><div class="sum-grid">
      <div class="k">Monto</div><div class="v">${s.presupuesto.monto||'—'}</div>
      <div class="k">Prioridad</div><div class="v">${s.presupuesto.distribucion||'—'}</div>
      <div class="k">Incluye obra</div><div class="v">${s.presupuesto.incluyeObra||'—'}</div>
      <div class="k">Flexibilidad</div><div class="v">${s.presupuesto.flexible||'—'}</div>
      <div class="k">Fecha límite</div><div class="v">${s.plazos.fecha||'—'}</div>
      <div class="k">Motivo</div><div class="v">${s.plazos.motivo||'—'}</div>
      <div class="k">Etapas</div><div class="v">${s.plazos.etapas||'—'}</div>
    </div></div>

    <div class="summary-block"><h3>Cierre</h3><div class="sum-grid">
      <div class="k">A evitar</div><div class="v">${s.cierre.evitar||'—'}</div>
      <div class="k">Palabra clave</div><div class="v">${s.cierre.palabra||'—'}</div>
      <div class="k">Pendientes</div><div class="v">${s.cierre.pendientes||'—'}</div>
    </div></div>
  `;
}

renderStep();
</script>
</body>
</html>
